<!doctype html>
<html lang="en-PH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart | Landers Superstore</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/base.css">
  <script defer src="/assets/layout.js"></script>
  <script defer src="/assets/app.js"></script>
</head>
<body data-page="cart">
  <div id="ld-header"></div>

  <main class="ld-wrap">
    <div class="ld-crumb"><a href="/">Home</a> / Shopping Cart</div>
    <div class="ld-page-head">
      <h1>Shopping Cart</h1>
      <div class="ld-count">Prices already include the 50% discount</div>
    </div>

    <div class="ld-cart">
      <div class="ld-cart-list" id="ld-cart-list"></div>
      <aside class="ld-cart-summary" id="ld-cart-summary"></aside>
    </div>
  </main>

  <div id="ld-footer"></div>
</body>
</html>
